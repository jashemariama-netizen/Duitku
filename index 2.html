/* Layout: satu kolom sempit ala app iPhone. Kartu ringkasan bergradasi Nox Noir ke Royal Amethyst di atas, daftar di bawah, tab di dasar, tombol + melayang. */
:root{
  /* Palet: Nox Noir 141414, Royal Amethyst 7E49B3, Steel Mist CFCFCF */
  --bg:#CFCFCF; --surface:#E9E8EB; --surface2:#DCDADF; --ink:#141414; --muted:#56515E; --line:#BDBBC2;
  --accent:#7E49B3; --accent-ink:#FFFFFF; --accent-text:#6A3A9C; --accent-soft:#E0D5EE; --bar:#BEB4CB;
  --out:#B23A2E; --in:#1F6E4D; --warn:#946310; --danger:#B3261E;
  --font:"Poppins",system-ui,-apple-system,"SF Pro Text",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#1F1D24; --surface2:#29262F; --ink:#EEECF1; --muted:#A59FB0; --line:#302C39;
    --accent:#7E49B3; --accent-ink:#FFFFFF; --accent-text:#B58BE0; --accent-soft:#2D2140; --bar:#3B3147;
    --out:#F08577; --in:#6FD0A0; --warn:#E0B04A; --danger:#F07A70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1F1D24; --surface2:#29262F; --ink:#EEECF1; --muted:#A59FB0; --line:#302C39;
  --accent:#7E49B3; --accent-ink:#FFFFFF; --accent-text:#B58BE0; --accent-soft:#2D2140; --bar:#3B3147;
  --out:#F08577; --in:#6FD0A0; --warn:#E0B04A; --danger:#F07A70;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--font);font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  min-height:100vh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
#app{max-width:520px;margin:0 auto}
h1{font-size:21px;margin:6px 0 14px;letter-spacing:-.01em;font-weight:700}
h2{font-size:11.5px;margin:24px 0 8px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
small{color:var(--muted)}
.mbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.mbar b{font-size:16px;text-transform:capitalize;font-weight:600}
.mbar button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;font-size:20px;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.hero{background:linear-gradient(155deg,#141414 0%,#38235a 44%,#7E49B3 100%);color:#fff;border-color:transparent}
.hero .lbl,.hero .cmp,.hero small{color:rgba(255,255,255,.76)}
.hero .lbl{font-size:13px}
.hero .big{font-size:31px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px;line-height:1.2}
.hero .cmp{font-size:12.5px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22)}
.split b{display:block;font-size:16px;font-weight:600}
.hero .in{color:#9BE8C0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px 6px 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.chip.plain{padding:7px 14px}
.alert{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.alert span{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.16)}
.alert .w{background:rgba(255,196,80,.3)}
.alert .o{background:rgba(255,110,90,.38)}
.searchrow{display:flex;gap:8px;margin:16px 0 4px}
.search{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.impbtn{flex:none;width:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--accent-text);cursor:pointer}
.impbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.ico svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:24px;height:24px;border-radius:8px}
.ico.sm svg{width:14px;height:14px}
.rt{flex:1;min-width:0;display:block}
.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.amt{font-weight:600;white-space:nowrap}
.amt.out{color:var(--out)} .amt.in{color:var(--in)}
.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);padding:4px 0;font-weight:600}
.cal button{aspect-ratio:1/1.15;min-width:0;border-radius:10px;padding:4px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--accent) calc(var(--h,0)*45%),var(--surface));border:1px solid var(--line);font-size:13px}
.cal button small{font-size:9.5px;line-height:1.1;color:var(--ink);opacity:.85;white-space:nowrap}
.cal button.sel{outline:2px solid var(--accent);outline-offset:1px}
.cal button.today b{color:var(--accent-text)}
.cal .blank{visibility:hidden}
.barrow{margin:14px 0}
.barrow:first-child{margin-top:0}
.barrow:last-child{margin-bottom:0}
.barrow .bh{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13.5px}
.barrow .bh span:first-child{display:flex;align-items:center;gap:9px;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--bar);overflow:hidden;margin:7px 0 5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn i{background:var(--warn)} .bar.over i{background:var(--danger)}
.delta{font-size:12px;color:var(--muted)}
.delta.up{color:var(--out);font-weight:600} .delta.down{color:var(--in);font-weight:600}
.avgline{font-size:11.5px;color:var(--muted)}
svg text.t{fill:var(--ink);font-size:11px;font-family:var(--font)} svg text.m{fill:var(--muted)} svg text.big2{font-size:15px;font-weight:700}
svg .b{fill:var(--bar)} svg .b.on{fill:var(--accent)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:16px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px}
.legend span.n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats b{display:block;font-size:16px;font-weight:600}
.bin{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted)}
.bin input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=search],input:not([type]),select,textarea{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-top:14px}
label.f>input,label.f>select,label.f>textarea{margin-top:6px;color:var(--ink);font-size:16px}
.menu .row{background:none}
.chev{color:var(--muted);font-size:20px}
.btn{display:inline-block;padding:11px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.block{display:block;width:100%}
.stack{display:flex;flex-direction:column;gap:10px}
.back{color:var(--accent-text);font-weight:600;padding:8px 0;display:inline-block}
.note{font-size:12.5px;color:var(--muted);margin:10px 2px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--bg);padding:2px 5px;border-radius:6px;word-break:break-all}
pre.code{white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);border-radius:12px;padding:12px;margin:8px 0}
.ed{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.ed:last-child{border-bottom:0}
.ed input[type=text],.ed input:not([type]){flex:1;min-width:0;padding:8px 10px}
.ed input[type=color]{width:36px;height:36px;padding:2px;border-radius:10px;border:1px solid var(--line);background:var(--bg);flex:none}
.ed .x{color:var(--danger);padding:6px 4px;font-weight:600;font-size:12.5px}
.icob{padding:0;flex:none;border-radius:12px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input,.addrow select{flex:1;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:6px 0;text-align:center}
nav button.on{color:var(--accent-text);font-weight:700}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-size:32px;line-height:1;text-align:center;z-index:25;box-shadow:0 8px 22px rgba(126,73,179,.45)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:22px 22px 0 0;max-height:92dvh;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
#sheet>div.in{max-width:520px;margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h b{font-size:16px}
.sheet-h .x{color:var(--accent-text);font-weight:600;padding:6px 0 6px 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px;text-align:center;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.amtbox{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:28px;font-weight:700}
.amtbox span{color:var(--muted);font-size:19px}
.amtbox input{border:0;background:none;font-size:28px;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:13.5px}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
details.paste{margin-top:14px;font-size:13.5px}
details.paste summary{color:var(--accent-text);font-weight:600;cursor:pointer}
details.paste textarea{margin:8px 0}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;z-index:90;max-width:90vw;text-align:center}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
#lock h1{margin:0}
.pdots{display:flex;gap:14px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.pdots i.f{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:25px;text-align:center}
.pad .z{background:none;border:0;font-size:14px}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>

</div></nav>
<div id="scrim" hidden data-act="close"></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>

function parseReceipt(text){
  var res={};var lines=text.split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean);
  var num=function(s){s=s.replace(/,\d{1,2}$/,'');s=s.replace(/[.,]/g,'');return parseInt(s,10)||0};
  var cands=[];
  lines.forEach(function(l,i){var re=/(?:rp|idr)\.?\s*(\d[\d.,]*)/gi,m;
    while((m=re.exec(l))){var v=num(m[1]);if(v>=100)cands.push({v:v,ctx:(lines[i-1]||'')+' '+l})}});
  if(cands.length){
    var key=cands.filter(function(c){return /total|jumlah|bayar|nominal|tagihan|amount/i.test(c.ctx)&&!/saldo|balance|admin/i.test(c.ctx)});
    var pool=cands.filter(function(c){return !/saldo|balance/i.test(c.ctx)});
    res.amount=key.length?key[0].v:Math.max.apply(null,(pool.length?pool:cands).map(function(c){return c.v}));
  }
  var mon={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,ags:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
  var m=text.match(/(\d{1,2})\s+(jan|feb|mar|apr|mei|may|jun|jul|agu|ags|aug|sep|okt|oct|nov|des|dec)[a-z]*\.?,?\s+(\d{4})/i);
  if(m)res.date=m[3]+'-'+pad(mon[m[2].toLowerCase()])+'-'+pad(+m[1]);
  else{m=text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m&&+m[2]<=12&&+m[1]<=31)res.date=m[3]+'-'+pad(+m[2])+'-'+pad(+m[1])}
  var lab=text.match(/(?:^|\n)\s*(?:ke|kepada|merchant|penerima|toko|tujuan|to)\b\s*[:\-]?\s*([^\n]{2,40})/i);
  if(lab)res.merchant=lab[1].trim();
  else{var bad=/berhasil|sukses|transaksi|pembayaran|transfer|detail|struk|bukti|\brp\b|idr|saldo|total|tanggal|waktu|status|^\d/i;
    var c=lines.find(function(l){return /[a-z]{3,}/i.test(l)&&l.length<=40&&!bad.test(l)&&!/\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/.test(l)});
    if(c)res.merchant=c}
  var low=text.toLowerCase();
  for(var i=0;i<S.sources.length;i++){var s=S.sources[i].toLowerCase();if(s.length>=3&&new RegExp('(^|[^a-z0-9])'+escRe(s)+'($|[^a-z0-9])').test(low)){res.src=S.sources[i];break}}
  return res;
}

function parseInbox(txt){
  txt=String(txt).replace(/^﻿/,'').replace(/```(?:json)?/gi,'').trim();if(!txt)return [];
  try{var o=JSON.parse(txt);return Array.isArray(o)?o:[o]}catch(e){}
  var out=[];txt.split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;
    try{out.push(JSON.parse(l))}catch(e){var m=l.match(/\{[\s\S]*\}/);if(m){try{out.push(JSON.parse(m[0]));return}catch(x){}}out.push(null)}});
  return out;
}
function pickSrc(v){
  v=String(v||'').trim();if(!v)return S.lastSrc||S.sources[0];
  var l=v.toLowerCase();
  var ex=S.sources.find(function(s){return s.toLowerCase()===l});if(ex)return ex;
  if(l.length>=3){var near=S.sources.find(function(s){var sl=s.toLowerCase();return sl.length>=3&&(l.indexOf(sl)>=0||sl.indexOf(l)>=0)});if(near)return near}
  if(v.length<=24){S.sources.push(v);return v}
  return S.lastSrc||S.sources[0];
}
function addImported(it){
  if(!it||typeof it!=='object'||it.error)return 'bad';
  var amount=toAmount(it.amount);if(!amount)return 'bad';
  var date=/^\d{4}-\d{2}-\d{2}$/.test(String(it.date||''))?it.date:todayStr();
  var time=/^\d{1,2}:\d{2}/.test(String(it.time||''))?String(it.time).slice(0,5):'';
  var merchant=String(it.merchant||'').trim().slice(0,60);
  var type=it.type==='in'?'in':'out';
  var key=[date,time,amount,merchant.toLowerCase()].join('|');
  if(S.imported.indexOf(key)>=0)return 'dup';
  var hour=time?parseInt(time,10):null;
  var cat='';
  if(type==='out')cat=matchCat(it.cat,hour)||guessCat(merchant,hour)||'lain';
  var ts=time?Date.parse(date+'T'+(time.length<5?'0'+time:time)+':00'):NaN;
  S.tx.push({id:uid(),type:type,amount:amount,cat:cat,src:pickSrc(it.src),date:date,merchant:merchant,note:String(it.note||'').slice(0,80),ts:isNaN(ts)?Date.now():ts});
  S.imported.push(key);if(S.imported.length>3000)S.imported=S.imported.slice(-3000);
  return 'ok';
}
async function importFiles(files){

  }

}

  rows.forEach(function(r){var len=C*r.v/out,seg=Math.max(len-gap,.5);
    s+='<circle cx="90" cy="90" r="'+R+'" fill="none" stroke="'+catById(r.id).color+'" stroke-width="26" stroke-dasharray="'+seg.toFixed(2)+' '+(C-seg).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';off+=len});
  return s+'</g><text x="90" y="84" text-anchor="middle" class="t m">Total</text><text x="90" y="104" text-anchor="middle" class="t big2">'+fmtNum(out)+'</text></svg>';

/* ---------- files ---------- */
async function giveFile(name,text,mime){
  var file=new File([text],name,{type:mime});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
}
function csv(){
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[['Tanggal','Jenis','Nominal','Kategori','Sumber','Merchant','Catatan']];
  sortTx(S.tx).forEach(function(t){rows.push([t.date,t.type==='out'?'Keluar':'Masuk',t.amount,t.type==='out'?catById(t.cat).name:'',t.src,t.merchant,t.note])});
  return '﻿'+rows.map(function(r){return r.map(q).join(',')}).join('\n');
}

/* ---------- pin ---------- */
async function hashPin(p){
  try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('duitku:'+p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
  catch(e){var h=5381,s='duitku:'+p;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+h}
}
var pinBuf='';
function showLock(){pinBuf='';var l=$('#lock');l.hidden=false;drawLock()}
function drawLock(){
  var l=$('#lock');
  l.innerHTML='<h1>Duitku</h1><div class="pdots" id="pdots">'+[0,1,2,3].map(function(i){return '<i class="'+(i<pinBuf.length?'f':'')+'"></i>'}).join('')+'</div><div class="pad">'+
   [1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-act="pinkey" data-v="'+n+'">'+n+'</button>'}).join('')+'<span></span><button data-act="pinkey" data-v="0">0</button><button class="z" data-act="pindel">Hapus</button></div>';
}
async function pinKey(v){
  if(pinBuf.length>=4)return;pinBuf+=v;drawLock();
  if(pinBuf.length===4){var ok=(await hashPin(pinBuf))===S.pin;
    if(ok){$('#lock').hidden=true;pinBuf=''}
    else{var d=$('#pdots');d.classList.add('shake');setTimeout(function(){pinBuf='';drawLock()},320)}}
}

  ftype:function(t){F.type=t.dataset.v;$('#sheet').querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===F.type)});refreshFormParts()},
  fcat:function(t){F.cat=t.dataset.id;F.catTouched=true;refreshFormParts()},
  fsrc:function(t){F.src=t.dataset.v;refreshFormParts()},
  fsave:saveForm,
  fdel:function(){if(!delArm){delArm=true;$('[data-act=fdel]').textContent='Ketuk lagi';return}
    S.tx=S.tx.filter(function(x){return x.id!==F.id});save();closeSheet();render();toast('Dihapus')},
  sub:function(t){sub=t.dataset.v||null;wipeArm=false;render();window.scrollTo(0,0)},
  catadd:function(){var n=$('#new-cat').value.trim();if(!n)return;S.cats.splice(S.cats.length-1,0,{id:'c'+uid(),name:n,color:PALETTE[S.cats.length%PALETTE.length],icon:'bintang'});save();render()},
  caticon:function(t){var c=S.cats.find(function(x){return x.id===t.dataset.id});if(!c)return;var i=ICON_KEYS.indexOf(c.icon);c.icon=ICON_KEYS[(i+1)%ICON_KEYS.length];save();render()},
  catdel:function(t){var id=t.dataset.id;S.tx.forEach(function(x){if(x.cat===id)x.cat='lain'});S.rules=S.rules.filter(function(r){return r.cat!==id});delete S.budgets[id];S.cats=S.cats.filter(function(c){return c.id!==id});save();render()},
  ruleadd:function(){var k=$('#rule-kw').value.trim().toLowerCase();if(!k)return;S.rules=S.rules.filter(function(r){return r.kw!==k});S.rules.unshift({kw:k,cat:$('#rule-cat').value});save();render();toast('Aturan ditambahkan')},
  ruledel:function(t){S.rules.splice(Number(t.dataset.i),1);save();render()},
  srcadd:function(){var n=$('#new-src').value.trim();if(!n||S.sources.indexOf(n)>=0)return;S.sources.push(n);save();render()},
  srcdel:function(t){S.sources.splice(Number(t.dataset.i),1);save();render()},
  recdel:function(t){S.recurring=S.recurring.filter(function(r){return r.id!==t.dataset.id});save();render()},
  export:function(){giveFile('duitku-cadangan-'+todayStr()+'.json',JSON.stringify(S),'application/json')},
  exportcsv:function(){giveFile('duitku-'+todayStr()+'.csv',csv(),'text/csv')},
  copy:function(){var txt=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('Data tersalin')}).catch(function(){toast('Salin gagal. Pakai Simpan cadangan.')})},
  wipe:function(){if(!wipeArm){wipeArm=true;render();return}S=defaults();save();wipeArm=false;sub=null;render();toast('Semua data dihapus')},
  pinset:async function(){var p=$('#pin-new').value.replace(/\D/g,'');if(p.length!==4){toast('PIN harus 4 angka');return}S.pin=await hashPin(p);save();render();toast('PIN aktif')},
  pinoff:function(){S.pin=null;save();render();toast('PIN dimatikan')},
  pinkey:function(t){pinKey(t.dataset.v)},
  pindel:function(){pinBuf=pinBuf.slice(0,-1);drawLock()}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var f=acts[t.dataset.act];if(f)f(t,e)});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='q'){q=el.value;render();return}
  if(el.id==='f-amount'){var n=digits(el.value);el.value=fmtNum(n);F.amount=n;return}
  if(el.id==='f-merchant'&&F){F.merchant=el.value;if(F.type==='out'&&!F.catTouched){var g=guessCat(el.value,F.hour);if(g&&g!==F.cat){F.cat=g;refreshFormParts()}}return}
  if(el.dataset.in==='budget'){el.value=fmtNum(digits(el.value))}
});
document.addEventListener('change',function(e){
  var el=e.target,k=el.dataset.in;
  if(el.id==='f-date'&&F){F.date=el.value;return}
  if(el.id==='restore'){var file=el.files[0];if(!file)return;file.text().then(function(txt){try{var o=JSON.parse(txt);if(!o||!Array.isArray(o.tx))throw 0;S=migrate(Object.assign(defaults(),o));save();render();toast('Data dipulihkan: '+S.tx.length+' catatan')}catch(x){toast('File tidak dikenali')}});return}
  if(k==='inbox'){var fl=Array.prototype.slice.call(el.files||[]);el.value='';if(fl.length)importFiles(fl);return}
  if(!k)return;
  if(k==='budget'){var v=digits(el.value),id=el.dataset.id;if(v)S.budgets[id]=v;else delete S.budgets[id];save();
    var row=el.closest('.brow'),sp=spendByCat(month)[id]||0,b=S.budgets[id]||0,pct=b?sp/b:0;
    row.querySelector('.bs').textContent=rp(sp)+(b?' / '+rp(b):'');
    var bar=row.querySelector('.bar');bar.className='bar '+(pct>=1?'over':pct>=.8?'warn':'');bar.firstChild.style.width=Math.min(100,pct*100)+'%';
    row.querySelector('.rest').textContent=b?(pct>=1?'Lewat '+rp(sp-b):'Sisa '+rp(b-sp)):'';return}
  if(k==='catname'){var c=S.cats.find(function(x){return x.id===el.dataset.id});if(c&&el.value.trim()){c.name=el.value.trim();save()}return}
  if(k==='catcolor'){var c2=S.cats.find(function(x){return x.id===el.dataset.id});if(c2){c2.color=el.value;save();render()}}
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return}
  ensureRecurring();
  if(S.pin&&hiddenAt&&Date.now()-hiddenAt>60000)showLock();
  render();
});

/* ---------- start ---------- */
ensureRecurring();
render();
if(S.pin)showLock();
(function fromUrl(){
  var p=new URLSearchParams(location.search);
  if(!(p.has('text')||p.has('amount')||p.has('merchant')))return;
  var init={};
  if(p.get('text')){var r=parseReceipt(p.get('text'));if(r.amount)init.amount=r.amount;if(r.date)init.date=r.date;if(r.src)init.src=r.src;if(r.merchant)init.merchant=r.merchant}
  if(p.get('amount'))init.amount=digits(p.get('amount'));
  if(p.get('merchant'))init.merchant=p.get('merchant');
  if(p.get('note'))init.note=p.get('note');
  if(p.get('date')&&/^\d{4}-\d{2}-\d{2}$/.test(p.get('date')))init.date=p.get('date');
  history.replaceState(null,'',location.pathname);
  openForm(init);
})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
