<style>
/* Layout: satu kolom sempit seperti app iPhone. Ringkasan di atas, daftar di bawah, tab di dasar, tombol + melayang. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#13201B; --muted:#5E6F68; --line:#DCE5E1;
  --accent:#0B7A63; --accent-ink:#FFFFFF; --accent-soft:#DDF0EA; --bar:#BFD9D0;
  --out:#B4421F; --in:#0B7A63; --warn:#B7791F; --danger:#C0392B;
  --font:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1412; --surface:#16211E; --ink:#E7F0EC; --muted:#90A39B; --line:#26352F;
    --accent:#3FCBA7; --accent-ink:#06231C; --accent-soft:#17352D; --bar:#2C4A41;
    --out:#F08A63; --in:#3FCBA7; --warn:#E0B04A; --danger:#EF6B5B;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));
  min-height:100vh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
#app{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:6px 0 14px;letter-spacing:-.01em}
h2{font-size:12px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
small{color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.mbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.mbar b{font-size:17px;text-transform:capitalize}
.mbar button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;font-size:20px;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero .lbl{color:var(--muted);font-size:13px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.hero .cmp{font-size:13px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.split b{display:block;font-size:17px}
.split .in{color:var(--in)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip .dot{width:9px;height:9px}
.alert{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.alert span{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--accent-soft)}
.alert .w{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.alert .o{background:color-mix(in srgb,var(--danger) 22%,transparent)}
.search{width:100%;margin:16px 0 4px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 6px;font-size:13px;color:var(--muted);font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.rt{flex:1;min-width:0;display:block}
.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.out{color:var(--out)} .amt.in{color:var(--in)}
.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);padding:4px 0;font-weight:600}
.cal button{aspect-ratio:1/1.15;min-width:0;border-radius:10px;padding:4px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--accent) calc(var(--h,0)*38%),var(--surface));border:1px solid var(--line);font-size:13px}
.cal button small{font-size:10px;line-height:1.1;color:var(--ink);opacity:.8;white-space:nowrap}
.cal button.sel{outline:2px solid var(--accent);outline-offset:1px}
.cal button.today b{color:var(--accent)}
.cal .blank{visibility:hidden}
.barrow{margin:12px 0}
.barrow .bh{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.barrow .bh span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--bar);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn i{background:var(--warn)} .bar.over i{background:var(--danger)}
.delta{font-size:12px;color:var(--muted)}
.delta.up{color:var(--out)} .delta.down{color:var(--in)}
svg text.t{fill:var(--ink);font-size:11px;font-family:var(--num)} svg text.m{fill:var(--muted)}
svg .b{fill:var(--bar)} svg .b.on{fill:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats b{display:block;font-size:17px}
.bin{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted)}
.bin input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=search],input:not([type]),select,textarea{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:block;font-size:13px;color:var(--muted);margin-top:14px}
label.f>input,label.f>select,label.f>textarea{margin-top:6px;color:var(--ink);font-size:16px}
.menu .row{background:none}
.menu .row small{display:block}
.chev{color:var(--muted);font-size:20px}
.btn{display:inline-block;padding:11px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.block{display:block;width:100%}
.stack{display:flex;flex-direction:column;gap:10px}
.back{color:var(--accent);font-weight:600;padding:8px 0;display:inline-block}
.note{font-size:13px;color:var(--muted);margin:10px 2px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--bg);padding:2px 5px;border-radius:6px;word-break:break-all}
pre.code{white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);border-radius:12px;padding:12px;margin:8px 0}
.ed{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.ed:last-child{border-bottom:0}
.ed input[type=text],.ed input:not([type]){flex:1;min-width:0;padding:8px 10px}
.ed input[type=color]{width:36px;height:36px;padding:2px;border-radius:10px;border:1px solid var(--line);background:var(--bg);flex:none}
.ed .x{color:var(--danger);padding:6px 8px;font-weight:600;font-size:13px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input,.addrow select{flex:1;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;text-align:center}
nav button.on{color:var(--accent);font-weight:700}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-size:32px;line-height:1;text-align:center;z-index:25;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:22px 22px 0 0;max-height:92dvh;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
#sheet>div.in{max-width:520px;margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h b{font-size:17px}
.sheet-h .x{color:var(--accent);font-weight:600;padding:6px 0 6px 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px;text-align:center;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.amtbox{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:30px;font-weight:700;font-family:var(--num)}
.amtbox span{color:var(--muted);font-size:20px}
.amtbox input{border:0;background:none;font-size:30px;font-weight:700;padding:0;font-family:var(--num);font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px}
.chk input{width:20px;height:20px;flex:none}
details.paste{margin-top:14px;font-size:14px}
details.paste summary{color:var(--accent);font-weight:600;cursor:pointer}
details.paste textarea{margin:8px 0}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:90;max-width:90vw}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
#lock h1{margin:0}
.pdots{display:flex;gap:14px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.pdots i.f{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:26px;font-family:var(--num);text-align:center}
.pad .z{background:none;border:0;font-size:15px}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<div id="app"><main id="main"></main></div>
<button class="fab" data-act="add" aria-label="Catat baru">+</button>
<nav aria-label="Menu utama"><div>
  <button data-act="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</button>
  <button data-act="tab" data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalender</button>
  <button data-act="tab" data-v="rep"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Laporan</button>
  <button data-act="tab" data-v="budget"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Anggaran</button>
  <button data-act="tab" data-v="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Lainnya</button>
</div></nav>
<div id="scrim" hidden data-act="close"></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" hidden></div>
<div id="lock" hidden></div>

<script>
(function(){
'use strict';
var LS='duitku.v1';
var $=function(s,el){return (el||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var todayStr=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var rp=function(n){return 'Rp '+Math.round(n).toLocaleString('id-ID')};
var fmtNum=function(n){return n?Math.round(n).toLocaleString('id-ID'):''};
var short=function(n){n=Math.abs(n);if(n>=1e6)return (Math.round(n/1e5)/10).toString().replace('.',',')+'jt';if(n>=1e3)return Math.round(n/1e3)+'rb';return String(Math.round(n))};
var digits=function(s){return parseInt(String(s).replace(/\D/g,''),10)||0};
var escRe=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')};

/* ---------- data ---------- */
var DEF_CATS=[
 {id:'makan',name:'Makan & Minum',color:'#D9822B'},
 {id:'belanja',name:'Belanja',color:'#7A5CC7'},
 {id:'transport',name:'Transport',color:'#2E86C1'},
 {id:'tagihan',name:'Tagihan & Pulsa',color:'#C0504D'},
 {id:'kuliah',name:'Kuliah',color:'#1E9E7A'},
 {id:'kesehatan',name:'Kesehatan',color:'#D6477F'},
 {id:'hiburan',name:'Hiburan',color:'#8A9A2B'},
 {id:'lain',name:'Lainnya',color:'#7C8A86'}];
var DEF_KW={
 makan:['kfc','mcd','mcdonald','starbucks','kopi','warung','bakso','geprek','nasi','ayam','burger','pizza','gofood','grabfood','shopeefood','resto','cafe','kantin','es teh','boba','chatime','janji jiwa'],
 belanja:['indomaret','alfamart','alfamidi','shopee','tokopedia','lazada','tiktok shop','supermarket','superindo','hypermart','blibli','miniso'],
 transport:['gojek','gocar','goride','grab','bensin','pertamina','shell','parkir','krl','kai','tol','transjakarta','tiket'],
 tagihan:['pln','listrik','token','pulsa','telkomsel','indosat','xl','axis','smartfren','indihome','wifi','pdam','paket data','by.u'],
 kuliah:['fotokopi','fotocopy','print','buku','ukt','spp','gramedia','alat tulis','praktikum'],
 kesehatan:['apotek','kimia farma','guardian','klinik','dokter','rumah sakit','halodoc','vitamin'],
 hiburan:['netflix','spotify','youtube','bioskop','cgv','xxi','steam','game','disney','vidio']};
var PALETTE=['#D9822B','#7A5CC7','#2E86C1','#C0504D','#1E9E7A','#D6477F','#8A9A2B','#B5651D','#3B7A9E','#9C5FA5'];
function defaults(){
  var rules=[];Object.keys(DEF_KW).forEach(function(c){DEF_KW[c].forEach(function(k){rules.push({kw:k,cat:c})})});
  return {v:1,tx:[],cats:DEF_CATS.map(function(c){return Object.assign({},c)}),rules:rules,budgets:{},recurring:[],
    sources:['Cash','GoPay','DANA','OVO','ShopeePay','M-banking'],pin:null,lastSrc:'Cash'};
}
function load(){
  try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);return Object.assign(defaults(),o)}}catch(e){}
  return defaults();
}
var S=load();
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Data gagal disimpan. Ruang penyimpanan penuh atau diblokir.')}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

/* ---------- helpers ---------- */
function shiftMonth(m,d){var p=m.split('-').map(Number);var x=new Date(p[0],p[1]-1+d,1);return x.getFullYear()+'-'+pad(x.getMonth()+1)}
function monthLabel(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}
function monShort(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('id-ID',{month:'short'})}
function dayLabel(d){var p=d.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})}
function monthTx(m){return S.tx.filter(function(t){return t.date.slice(0,7)===m})}
function sum(list,type){return list.reduce(function(a,t){return a+(t.type===type?t.amount:0)},0)}
function spendByCat(m){var o={};monthTx(m).forEach(function(t){if(t.type==='out')o[t.cat]=(o[t.cat]||0)+t.amount});return o}
function catById(id){return S.cats.find(function(c){return c.id===id})||S.cats.find(function(c){return c.id==='lain'})||{id:'lain',name:'Lainnya',color:'#7C8A86'}}
function guessCat(text){
  var t=String(text||'').toLowerCase();if(!t.trim())return null;
  var rules=S.rules.slice().sort(function(a,b){return b.kw.length-a.kw.length});
  for(var i=0;i<rules.length;i++){var r=rules[i];
    if(!S.cats.some(function(c){return c.id===r.cat}))continue;
    var hit=r.kw.length<=3?new RegExp('(^|[^a-z0-9])'+escRe(r.kw)+'($|[^a-z0-9])').test(t):t.indexOf(r.kw)>=0;

function parseReceipt(text){
  var res={};var lines=text.split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean);
  var num=function(s){s=s.replace(/,\d{1,2}$/,'');s=s.replace(/[.,]/g,'');return parseInt(s,10)||0};
  var cands=[];
  lines.forEach(function(l,i){var re=/(?:rp|idr)\.?\s*(\d[\d.,]*)/gi,m;
    while((m=re.exec(l))){var v=num(m[1]);if(v>=100)cands.push({v:v,ctx:(lines[i-1]||'')+' '+l})}});
  if(cands.length){
    var key=cands.filter(function(c){return /total|jumlah|bayar|nominal|tagihan|amount/i.test(c.ctx)&&!/saldo|balance|admin/i.test(c.ctx)});
    var pool=cands.filter(function(c){return !/saldo|balance/i.test(c.ctx)});
    res.amount=key.length?key[0].v:Math.max.apply(null,(pool.length?pool:cands).map(function(c){return c.v}));
  }
  var mon={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,ags:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
  var m=text.match(/(\d{1,2})\s+(jan|feb|mar|apr|mei|may|jun|jul|agu|ags|aug|sep|okt|oct|nov|des|dec)[a-z]*\.?,?\s+(\d{4})/i);
  if(m)res.date=m[3]+'-'+pad(mon[m[2].toLowerCase()])+'-'+pad(+m[1]);
  else{m=text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m&&+m[2]<=12&&+m[1]<=31)res.date=m[3]+'-'+pad(+m[2])+'-'+pad(+m[1])}
  var lab=text.match(/(?:^|\n)\s*(?:ke|kepada|merchant|penerima|toko|tujuan|to)\b\s*[:\-]?\s*([^\n]{2,40})/i);
  if(lab)res.merchant=lab[1].trim();
  else{var bad=/berhasil|sukses|transaksi|pembayaran|transfer|detail|struk|bukti|\brp\b|idr|saldo|total|tanggal|waktu|status|^\d/i;
    var c=lines.find(function(l){return /[a-z]{3,}/i.test(l)&&l.length<=40&&!bad.test(l)&&!/\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/.test(l)});
    if(c)res.merchant=c}
  var low=text.toLowerCase();
  var map=[['gopay','GoPay'],['dana','DANA'],['ovo','OVO'],['shopeepay','ShopeePay'],['linkaja','LinkAja'],['bca','M-banking'],['mandiri','M-banking'],['bni','M-banking'],['bri','M-banking'],['jago','M-banking'],['seabank','M-banking'],['livin','M-banking']];
  for(var i=0;i<map.length;i++){if(new RegExp('\\b'+map[i][0]+'\\b').test(low)&&S.sources.indexOf(map[i][1])>=0){res.src=map[i][1];break}}
  return res;
}
function ensureRecurring(){

  '<label class="f">Sumber dana</label><div id="f-srcs">'+srcHTML()+'</div>'+
  '<label class="f">Tanggal<input type="date" id="f-date" value="'+esc(F.date)+'"></label>'+
  '<label class="f">Catatan (opsional)<input type="text" id="f-note" autocomplete="off" value="'+esc(F.note)+'"></label>'+
  (e?'':'<label class="chk"><input type="checkbox" id="f-rec"> Ulangi tiap bulan di tanggal ini</label>')+
  '<details class="paste"><summary>Tempel teks dari screenshot</summary><textarea id="f-paste" placeholder="Tempel hasil baca teks screenshot di sini"></textarea><button type="button" class="btn" data-act="parse">Isi otomatis</button></details>'+
  '<div class="actions">'+(e?'<button type="button" class="btn danger" data-act="fdel">'+(delArm?'Ketuk lagi':'Hapus')+'</button>':'')+'<button type="button" class="btn primary" data-act="fsave">Simpan</button></div>';
}
function refreshFormParts(){$('#f-cats').innerHTML=chipsHTML();$('#f-srcs').innerHTML=srcHTML()}
function saveForm(){
  var a=digits($('#f-amount').value);if(!a){toast('Isi nominalnya dulu');$('#f-amount').focus();return}
  F.amount=a;F.merchant=$('#f-merchant').value.trim();F.note=$('#f-note').value.trim();F.date=$('#f-date').value||todayStr();
  if(F.type==='out'&&!F.cat)F.cat=guessCat(F.merchant)||'lain';
  if(F.type==='in')F.cat='';
  if(F.type==='out'&&F.merchant&&F.catTouched){
    var kw=F.merchant.toLowerCase();
    if(kw.length>=2&&kw.length<=40&&guessCat(kw)!==F.cat){S.rules=S.rules.filter(function(r){return r.kw!==kw});S.rules.unshift({kw:kw,cat:F.cat})}}
  var rec={id:F.id||uid(),type:F.type,amount:F.amount,cat:F.cat,src:F.src,date:F.date,merchant:F.merchant,note:F.note,ts:Date.now()};
  if(F.id){var i=S.tx.findIndex(function(x){return x.id===F.id});if(i>=0){rec.ts=S.tx[i].ts||rec.ts;S.tx[i]=rec}}
  else S.tx.push(rec);
  var wantRec=!F.id&&$('#f-rec')&&$('#f-rec').checked;
  if(wantRec){S.recurring.push({id:uid(),type:F.type,amount:F.amount,cat:F.cat,src:F.src,merchant:F.merchant,note:F.note,day:Number(F.date.slice(8)),start:F.date.slice(0,7),done:[F.date.slice(0,7)]})}
  S.lastSrc=F.src;save();
  if(F.date.slice(0,7)!==month&&view!=='more'){month=F.date.slice(0,7)}
  closeSheet();render();toast(wantRec?'Tersimpan. Akan berulang tiap bulan.':'Tersimpan');
}

/* ---------- files ---------- */
async function giveFile(name,text,mime){
  var file=new File([text],name,{type:mime});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
}
function csv(){
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[['Tanggal','Jenis','Nominal','Kategori','Sumber','Merchant','Catatan']];
  sortTx(S.tx).forEach(function(t){rows.push([t.date,t.type==='out'?'Keluar':'Masuk',t.amount,t.type==='out'?catById(t.cat).name:'',t.src,t.merchant,t.note])});
  return '﻿'+rows.map(function(r){return r.map(q).join(',')}).join('\n');
}

/* ---------- pin ---------- */
async function hashPin(p){
  try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('duitku:'+p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
  catch(e){var h=5381,s='duitku:'+p;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+h}
}
var pinBuf='';
function showLock(){pinBuf='';var l=$('#lock');l.hidden=false;drawLock()}
function drawLock(){
  var l=$('#lock');
  l.innerHTML='<h1>Duitku</h1><div class="pdots" id="pdots">'+[0,1,2,3].map(function(i){return '<i class="'+(i<pinBuf.length?'f':'')+'"></i>'}).join('')+'</div><div class="pad">'+
   [1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-act="pinkey" data-v="'+n+'">'+n+'</button>'}).join('')+'<span></span><button data-act="pinkey" data-v="0">0</button><button class="z" data-act="pindel">Hapus</button></div>';
}
async function pinKey(v){
  if(pinBuf.length>=4)return;pinBuf+=v;drawLock();
  if(pinBuf.length===4){var ok=(await hashPin(pinBuf))===S.pin;
    if(ok){$('#lock').hidden=true;pinBuf=''}
    else{var d=$('#pdots');d.classList.add('shake');setTimeout(function(){pinBuf='';drawLock()},320)}}
}

/* ---------- render + events ---------- */
function render(){
  var h=view==='home'?renderHome():view==='cal'?renderCal():view==='rep'?renderRep():view==='budget'?renderBudget():renderMore();
  var m=$('#main'),keep=document.activeElement&&document.activeElement.id==='q';
  m.innerHTML=h;
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});
  if(keep){var qi=$('#q');qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
}
var acts={
  tab:function(t){view=t.dataset.v;sub=null;render();window.scrollTo(0,0)},
  mprev:function(){month=shiftMonth(month,-1);if(view==='cal')calDay=month+'-01';render()},
  mnext:function(){month=shiftMonth(month,1);if(view==='cal')calDay=month+'-01';render()},
  calday:function(t){calDay=t.dataset.v;render()},
  add:function(){openForm()},
  edit:function(t){openForm({id:t.dataset.id})},
  close:closeSheet,
  ftype:function(t){F.type=t.dataset.v;$('#sheet').querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===F.type)});refreshFormParts()},
  fcat:function(t){F.cat=t.dataset.id;F.catTouched=true;refreshFormParts()},
  fsrc:function(t){F.src=t.dataset.v;refreshFormParts()},
  fsave:saveForm,
  fdel:function(){if(!delArm){delArm=true;$('[data-act=fdel]').textContent='Ketuk lagi';return}
    S.tx=S.tx.filter(function(x){return x.id!==F.id});save();closeSheet();render();toast('Dihapus')},
  parse:function(){var txt=$('#f-paste').value;if(!txt.trim()){toast('Tempel teksnya dulu');return}
    var r=parseReceipt(txt);F.merchant=$('#f-merchant').value.trim();F.note=$('#f-note').value.trim();
    if(r.amount)F.amount=r.amount;if(r.date)F.date=r.date;if(r.src)F.src=r.src;if(r.merchant&&!F.merchant)F.merchant=r.merchant;
    if(F.type==='out'&&!F.catTouched){var g=guessCat(F.merchant);if(g)F.cat=g}
    showSheet(formHTML());toast(r.amount?'Terisi. Cek lagi sebelum Simpan.':'Nominal tidak ditemukan')},
  sub:function(t){sub=t.dataset.v||null;wipeArm=false;render();window.scrollTo(0,0)},
  catadd:function(){var n=$('#new-cat').value.trim();if(!n)return;S.cats.splice(S.cats.length-1,0,{id:'c'+uid(),name:n,color:PALETTE[S.cats.length%PALETTE.length]});save();render()},
  catdel:function(t){var id=t.dataset.id;S.tx.forEach(function(x){if(x.cat===id)x.cat='lain'});S.rules=S.rules.filter(function(r){return r.cat!==id});delete S.budgets[id];S.cats=S.cats.filter(function(c){return c.id!==id});save();render()},
  ruleadd:function(){var k=$('#rule-kw').value.trim().toLowerCase();if(!k)return;S.rules=S.rules.filter(function(r){return r.kw!==k});S.rules.unshift({kw:k,cat:$('#rule-cat').value});save();render();toast('Aturan ditambahkan')},
  ruledel:function(t){S.rules.splice(Number(t.dataset.i),1);save();render()},
  srcadd:function(){var n=$('#new-src').value.trim();if(!n||S.sources.indexOf(n)>=0)return;S.sources.push(n);save();render()},
  srcdel:function(t){S.sources.splice(Number(t.dataset.i),1);save();render()},
  recdel:function(t){S.recurring=S.recurring.filter(function(r){return r.id!==t.dataset.id});save();render()},
  export:function(){giveFile('duitku-cadangan-'+todayStr()+'.json',JSON.stringify(S),'application/json')},
  exportcsv:function(){giveFile('duitku-'+todayStr()+'.csv',csv(),'text/csv')},
  copy:function(){var txt=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('Data tersalin')}).catch(function(){toast('Salin gagal. Pakai Simpan cadangan.')})},
  copyurl:function(){var u=location.origin+location.pathname;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast('Alamat tersalin')}).catch(function(){toast('Salin manual dari kotak di atas')})},
  wipe:function(){if(!wipeArm){wipeArm=true;render();return}S=defaults();save();wipeArm=false;sub=null;render();toast('Semua data dihapus')},
  pinset:async function(){var p=$('#pin-new').value.replace(/\D/g,'');if(p.length!==4){toast('PIN harus 4 angka');return}S.pin=await hashPin(p);save();render();toast('PIN aktif')},
  pinoff:function(){S.pin=null;save();render();toast('PIN dimatikan')},
  pinkey:function(t){pinKey(t.dataset.v)},
  pindel:function(){pinBuf=pinBuf.slice(0,-1);drawLock()}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var f=acts[t.dataset.act];if(f)f(t,e)});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='q'){q=el.value;render();return}
  if(el.id==='f-amount'){var n=digits(el.value);el.value=fmtNum(n);F.amount=n;return}
  if(el.id==='f-merchant'&&F){F.merchant=el.value;if(F.type==='out'&&!F.catTouched){var g=guessCat(el.value);if(g&&g!==F.cat){F.cat=g;refreshFormParts()}}return}
  if(el.dataset.in==='budget'){el.value=fmtNum(digits(el.value))}
});
document.addEventListener('change',function(e){
  var el=e.target,k=el.dataset.in;
  if(el.id==='f-date'&&F){F.date=el.value;return}
  if(el.id==='restore'){var file=el.files[0];if(!file)return;file.text().then(function(txt){try{var o=JSON.parse(txt);if(!o||!Array.isArray(o.tx))throw 0;S=Object.assign(defaults(),o);save();render();toast('Data dipulihkan: '+S.tx.length+' catatan')}catch(x){toast('File tidak dikenali')}});return}
  if(!k)return;
  if(k==='budget'){var v=digits(el.value),id=el.dataset.id;if(v)S.budgets[id]=v;else delete S.budgets[id];save();
    var row=el.closest('.brow'),sp=spendByCat(month)[id]||0,b=S.budgets[id]||0,pct=b?sp/b:0;
    row.querySelector('.bs').textContent=rp(sp)+(b?' / '+rp(b):'');
    var bar=row.querySelector('.bar');bar.className='bar '+(pct>=1?'over':pct>=.8?'warn':'');bar.firstChild.style.width=Math.min(100,pct*100)+'%';
    row.querySelector('.rest').textContent=b?(pct>=1?'Lewat '+rp(sp-b):'Sisa '+rp(b-sp)):'';return}
  if(k==='catname'){var c=S.cats.find(function(x){return x.id===el.dataset.id});if(c&&el.value.trim()){c.name=el.value.trim();save()}return}
  if(k==='catcolor'){var c2=S.cats.find(function(x){return x.id===el.dataset.id});if(c2){c2.color=el.value;save()}}
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return}
  ensureRecurring();
  if(S.pin&&hiddenAt&&Date.now()-hiddenAt>60000)showLock();
  render();
});

/* ---------- start ---------- */
ensureRecurring();
render();
if(S.pin)showLock();
(function fromUrl(){
  var p=new URLSearchParams(location.search);
  if(!(p.has('text')||p.has('amount')||p.has('merchant')))return;
  var init={};
  if(p.get('text')){var r=parseReceipt(p.get('text'));if(r.amount)init.amount=r.amount;if(r.date)init.date=r.date;if(r.src)init.src=r.src;if(r.merchant)init.merchant=r.merchant}
  if(p.get('amount'))init.amount=digits(p.get('amount'));
  if(p.get('merchant'))init.merchant=p.get('merchant');
  if(p.get('note'))init.note=p.get('note');
  if(p.get('date')&&/^\d{4}-\d{2}-\d{2}$/.test(p.get('date')))init.date=p.get('date');
  if(p.get('src')){var s=p.get('src').toLowerCase();var m=S.sources.find(function(x){return x.toLowerCase()===s});if(m)init.src=m}
  history.replaceState(null,'',location.pathname);
  openForm(init);
})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
